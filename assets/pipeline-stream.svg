<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 150" width="100%" height="100%">
  <defs>
    <linearGradient id="pipeCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c17"/>
      <stop offset="100%" stop-color="#0e1424"/>
    </linearGradient>

    <linearGradient id="pulseCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <style>
      @keyframes circuitMarch {
        0% { stroke-dashoffset: 120; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes nodePulse {
        0%, 100% { opacity: 0.8; filter: drop-shadow(0 0 0px #38bdf8); }
        50% { opacity: 1; filter: drop-shadow(0 0 6px #38bdf8); }
      }
      .moving-wire {
        stroke-dasharray: 6 12;
        animation: circuitMarch 2.5s linear infinite;
      }
      .active-node {
        animation: nodePulse 3s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Container -->
  <rect width="920" height="150" rx="12" fill="url(#pipeCardBg)" stroke="rgba(56, 189, 248, 0.14)" stroke-width="1"/>

  <!-- Top Title Bar -->
  <rect x="0" y="0" width="920" height="32" rx="12" fill="rgba(255, 255, 255, 0.02)"/>
  <text x="24" y="21" font-family="ui-monospace, 'SF Mono', Consolas, monospace" font-size="10" font-weight="700" fill="#38bdf8" letter-spacing="1">OPERATIONAL SPECIFICATION PIPELINE // ARCHITECTURE DATA STREAM</text>
  <text x="896" y="21" text-anchor="end" font-family="ui-monospace, 'SF Mono', Consolas, monospace" font-size="10" fill="#10b981">● LIVE_DATA_STREAM</text>
  <line x1="0" y1="32" x2="920" y2="32" stroke="rgba(56, 189, 248, 0.08)" stroke-width="1"/>

  <!-- Connecting Highway Line -->
  <line x1="120" y1="90" x2="800" y2="90" stroke="rgba(255, 255, 255, 0.08)" stroke-width="2"/>
  <line class="moving-wire" x1="120" y1="90" x2="800" y2="90" stroke="#38bdf8" stroke-width="2"/>

  <!-- Stage 01 -->
  <g class="active-node" transform="translate(24, 48)">
    <rect width="190" height="84" rx="8" fill="rgba(15, 23, 42, 0.7)" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1"/>
    <circle cx="16" cy="18" r="3.5" fill="#38bdf8"/>
    <text x="26" y="21" font-family="ui-monospace, 'SF Mono', Consolas, monospace" font-size="9" font-weight="700" fill="#38bdf8">01 // GROUND TRUTH</text>
    <text x="16" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Operations Reality</text>
    <text x="16" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="10" fill="#94a3b8">Truck dwell, scales &amp; CHA</text>
    <text x="16" y="74" font-family="ui-monospace, 'SF Mono', Consolas, monospace" font-size="9" fill="#64748b">INPUT: Physical constraints</text>
  </g>

  <!-- Stage 02 -->
  <g class="active-node" transform="translate(254, 48)">
    <rect width="190" height="84" rx="8" fill="rgba(15, 23, 42, 0.7)" stroke="rgba(129, 140, 248, 0.25)" stroke-width="1"/>
    <circle cx="16" cy="18" r="3.5" fill="#818cf8"/>
    <text x="26" y="21" font-family="ui-monospace, 'SF Mono', Consolas, monospace" font-size="9" font-weight="700" fill="#818cf8">02 // CONTRACTS</text>
    <text x="16" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Technical Specs</text>
    <text x="16" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="10" fill="#94a3b8">Carrier APIs &amp; EDI C-IMP/XML</text>
    <text x="16" y="74" font-family="ui-monospace, 'SF Mono', Consolas, monospace" font-size="9" fill="#64748b">SCHEMA: Strict data contracts</text>
  </g>

  <!-- Stage 03 -->
  <g class="active-node" transform="translate(484, 48)">
    <rect width="190" height="84" rx="8" fill="rgba(15, 23, 42, 0.7)" stroke="rgba(16, 185, 129, 0.25)" stroke-width="1"/>
    <circle cx="16" cy="18" r="3.5" fill="#10b981"/>
    <text x="26" y="21" font-family="ui-monospace, 'SF Mono', Consolas, monospace" font-size="9" font-weight="700" fill="#34d399">03 // PROTOTYPE &amp; UAT</text>
    <text x="16" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Sprint Execution</text>
    <text x="16" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="10" fill="#94a3b8">Jira stories &amp; acceptance runs</text>
    <text x="16" y="74" font-family="ui-monospace, 'SF Mono', Consolas, monospace" font-size="9" fill="#64748b">AI LAB: Working testbeds</text>
  </g>

  <!-- Stage 04 -->
  <g class="active-node" transform="translate(714, 48)">
    <rect width="182" height="84" rx="8" fill="rgba(56, 189, 248, 0.08)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.2"/>
    <circle cx="16" cy="18" r="3.5" fill="#38bdf8"/>
    <text x="26" y="21" font-family="ui-monospace, 'SF Mono', Consolas, monospace" font-size="9" font-weight="700" fill="#38bdf8">04 // PRODUCTION</text>
    <text x="16" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12" font-weight="700" fill="#38bdf8">Shipped Systems</text>
    <text x="16" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="10" fill="#f8fafc">0-to-1 CRM &amp; Cloud ERP</text>
    <text x="16" y="74" font-family="ui-monospace, 'SF Mono', Consolas, monospace" font-size="9" fill="#10b981">RESULT: 0% schema rework</text>
  </g>
</svg>
