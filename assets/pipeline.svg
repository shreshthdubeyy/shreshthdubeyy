<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 120" width="100%" height="100%">
  <defs>
    <linearGradient id="pipeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <rect width="920" height="120" rx="12" fill="url(#pipeBg)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>

  <!-- Step 1 -->
  <g transform="translate(24, 20)">
    <rect width="190" height="80" rx="8" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
    <text x="16" y="26" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#38bdf8" letter-spacing="0.5">PHASE 01 // DISCOVERY</text>
    <text x="16" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#f0f6fc">Ground Operations</text>
    <text x="16" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#8b949e">Terminal bottlenecks &amp; workflows</text>
  </g>

  <!-- Arrow 1 to 2 -->
  <line x1="222" y1="60" x2="246" y2="60" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 2 -->
  <g transform="translate(254, 20)">
    <rect width="190" height="80" rx="8" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
    <text x="16" y="26" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#818cf8" letter-spacing="0.5">PHASE 02 // CONTRACTS</text>
    <text x="16" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#f0f6fc">Technical Integration</text>
    <text x="16" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#8b949e">Carrier APIs, EDI (C-XML/C-IMP)</text>
  </g>

  <!-- Arrow 2 to 3 -->
  <line x1="452" y1="60" x2="476" y2="60" stroke="#818cf8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 3 -->
  <g transform="translate(484, 20)">
    <rect width="190" height="80" rx="8" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
    <text x="16" y="26" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#34d399" letter-spacing="0.5">PHASE 03 // DELIVERY</text>
    <text x="16" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#f0f6fc">Sprint Specs &amp; UAT</text>
    <text x="16" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#8b949e">State machines, stories &amp; tests</text>
  </g>

  <!-- Arrow 3 to 4 -->
  <line x1="682" y1="60" x2="706" y2="60" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 4 -->
  <g transform="translate(714, 20)">
    <rect width="182" height="80" rx="8" fill="rgba(56, 189, 248, 0.06)" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1"/>
    <text x="16" y="26" font-family="ui-monospace, monospace" font-size="10" font-weight="700" fill="#38bdf8" letter-spacing="0.5">PHASE 04 // OUTCOME</text>
    <text x="16" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#38bdf8">Shipped Software</text>
    <text x="16" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" fill="#94a3b8">0-to-1 CRM, Cloud CMS, ERP</text>
  </g>
</svg>
